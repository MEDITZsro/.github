name: Chyba
description: Něco se chová jinak, než má.
title: Krátký popis chyby
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Vyplň, co víš. Nevadí, když nevíš, do kterého repa to patří. Issue zatřídí a doplní vývoj.
  - type: dropdown
    id: product
    attributes:
      label: Produkt
      options:
        - BI (přehledy, dashboardy, exporty)
        - DynamicAd
        - mBOX
        - Web
        - Jiné / nevím
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Co se děje
      description: Popis chyby a koho zasahuje.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Jak chybu vyvolat
      description: Kroky po sobě.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Očekávané a skutečné chování
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Kde se to děje
      description: Prostředí (tdm8.online, bi.meditz.cz, …), adresa stránky, čas.
  - type: dropdown
    id: urgency
    attributes:
      label: Jak moc to spěchá
      options:
        - Blokuje práci nebo klienta
        - Vadí, ale dá se obejít
        - Kosmetika
  - type: textarea
    id: attachments
    attributes:
      label: Přílohy
      description: Snímky obrazovky, logy a soubory sem přetáhni myší.
